name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Install package managers
        run: npm install --global npm@11.9.0 pnpm@10.34.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'

      - name: Install RSpec
        run: gem install rspec --version 3.13.2 --no-document

      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
